# Static site. The only build step is a dependency-free Node script that writes
# one page per specimen, the Archive's catalogue index and sitemap.xml from js/data.js.
[build]
  publish = "."
  command = "node tools/build.mjs"

# One home for search: send the .shop domain (and www) to techsidermy.store, keeping the path.
[[redirects]]
  from = "https://techsidermy.shop/*"
  to = "https://techsidermy.store/:splat"
  status = 301
  force = true
[[redirects]]
  from = "https://www.techsidermy.shop/*"
  to = "https://techsidermy.store/:splat"
  status = 301
  force = true
[[redirects]]
  from = "https://www.techsidermy.store/*"
  to = "https://techsidermy.store/:splat"
  status = 301
  force = true

# Keep the project notes out of the public site
[[redirects]]
  from = "/README.md"
  to = "/404"
  status = 404
  force = true
[[redirects]]
  from = "/CLAUDE.md"
  to = "/404"
  status = 404
  force = true

# Command center: keep it out of search engines
[[headers]]
  for = "/lab*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

[[redirects]]
  from = "/tools/*"
  to = "/404"
  status = 404
  force = true
[[redirects]]
  from = "/supabase/*"
  to = "/404"
  status = 404
  force = true
