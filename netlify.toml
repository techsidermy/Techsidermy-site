# Static site: no build step. Netlify serves this folder as-is.
[build]
  publish = "."
  command = ""

# Keep the project notes out of the public site
[[redirects]]
  from = "/README.md"
  to = "/404"
  status = 404
  force = true
[[redirects]]
  from = "/CLAUDE.md"
  to = "/404"
  status = 404
  force = true

# Command center: keep it out of search engines
[[headers]]
  for = "/lab*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"
