<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Command Center · Techsidermy Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital@0;1&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600&display=swap">
<link rel="stylesheet" href="css/site.css?v=15">
<link rel="stylesheet" href="css/lab.css?v=3">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/assets/favicon-192.png" type="image/png" sizes="192x192">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
</head>
<body data-page="lab">

<header class="lab-head">
  <div class="wrap">
    <a href="index.html" class="wordmark" aria-label="Techsidermy Lab, public site"><b>TECHSIDERMY</b><i>LAB</i></a>
    <span class="label">Command center</span>
    <button class="lab-link" id="signout" type="button" hidden>Sign out</button>
  </div>
  <div class="head-rule"></div>
</header>

<main class="wrap lab-main">

  <!-- signed out -->
  <section id="gate" class="gate" hidden>
    <span class="label">Restricted · lab staff only</span>
    <h1 class="h2 mt-1">Sign in<span class="dot">.</span></h1>
    <form id="login" class="gate-form" novalidate>
      <label class="label" for="login-user">Username</label>
      <input id="login-user" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required>
      <label class="label" for="login-pass">Password</label>
      <input id="login-pass" type="password" autocomplete="current-password" required>
      <button class="btn" type="submit">Sign in</button>
      <p class="mono-sm" id="login-msg" role="status"></p>
    </form>
  </section>

  <!-- not configured -->
  <section id="setup" class="gate" hidden>
    <span class="label label--accent">Setup needed</span>
    <h1 class="h2 mt-1">Connect Supabase<span class="dot">.</span></h1>
    <p class="mono-sm">Add your project URL and anon key to <code>js/lab-config.js</code>, then redeploy.</p>
  </section>

  <!-- signed in -->
  <section id="app" hidden>
    <nav class="lab-nav" id="lab-nav" aria-label="Command center"></nav>
    <p class="lab-error" id="err" role="alert" hidden></p>
    <div id="view" class="view"></div>
  </section>
</main>

<!-- editor drawer -->
<aside class="drawer" id="drawer" aria-hidden="true">
  <form class="drawer-in" id="drawer-form">
    <div class="drawer-top"><span class="label" id="drawer-title">Edit</span><button type="button" class="lab-link" data-close>Close</button></div>
    <div id="drawer-fields" class="fields"></div>
    <div class="drawer-actions">
      <button class="btn" type="submit">Save</button>
      <button class="lab-link danger" type="button" id="drawer-delete" hidden>Delete</button>
    </div>
  </form>
</aside>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="js/lab-config.js?v=2"></script>
<script src="js/lab.js?v=3"></script>
</body>
</html>
